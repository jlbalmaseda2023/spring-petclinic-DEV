name: CI - Build y Test

on:
  push:
    branches: [main, feature-1, feature-2]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar con Maven
        run: ./mvnw clean package -DskipTests

      - name: Ejecutar tests
        run: ./mvnw test

      - name: Subir JAR como artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: petclinic-jar
          path: target/*.jar

      - name: Notificar a n8n (opcional)
        if: always()
        run: |
          curl -X POST ${{ secrets.N8N_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"${{ job.status }}\",\"branch\":\"${{ github.ref_name }}\",\"commit\":\"${{ github.sha }}\"}" \
            || echo "Webhook no configurado"
